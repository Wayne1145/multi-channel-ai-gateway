[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-channel-clawbot-bridge"
version = "0.1.0"
description = "Optional WeChat ClawBot iLink bridge for Multi-Channel AI Gateway"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
  "cryptography>=48,<51",
  "pydantic-settings>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
