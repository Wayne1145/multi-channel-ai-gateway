version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-runtime:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /bridge
    schedule:
      interval: weekly
    groups:
      bridge-runtime:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly