name: Bug report
description: 报告可复现的问题；请勿提交密钥、令牌或真实用户数据。
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先删除日志中的账号标识、消息正文、二维码、Token 和 Cookie。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 部署环境
      description: 操作系统、Docker/Compose、PostgreSQL 版本；不要粘贴 .env。