name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 uv 与 Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: 安装项目与开发依赖
        run: uv sync --extra dev --locked
      - name: 运行 Ruff 静态检查
        run: uv run ruff check src tests
      - name: 运行测试与覆盖率检查
        run: uv run pytest --cov=wecom_ai_gateway --cov-report=term-missing
      - name: 构建容器镜像
        run: docker build -t wecom-ai-gateway:test .
