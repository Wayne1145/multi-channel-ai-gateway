[project]
name = "wecom-ai-gateway"
version = "0.3.0"
description = "Multi-user AI gateway for WeCom Customer Service"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Wayne1145"}]
dependencies = [
  "fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1", "sqlalchemy>=2.0.41,<3",
  "alembic>=1.16,<2", "psycopg[binary]>=3.2,<4", "redis>=6,<7",
  "httpx>=0.28,<1", "cryptography>=48.0.1,<51", "pydantic-settings>=2.10,<3",
  "jinja2>=3.1,<4", "python-multipart>=0.0.20,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-cov>=6.2,<7", "respx>=0.22,<1", "ruff>=0.12,<1"]
[tool.pytest.ini_options]
addopts = "-q --disable-warnings"
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]
